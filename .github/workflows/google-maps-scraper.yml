name: Google Maps nationwide and worldwide scraper

on:
  push:
    paths:
      - alpha/worldwide.py
      - .github/workflows/google-maps-scraper.yml
  workflow_dispatch:
    inputs:
      region:
        description: Nationwide US or a worldwide region
        type: choice
        options: [nationwide, worldwide, north-america, south-america, europe, africa, asia, oceania]
        default: nationwide
      offset:
        description: Query offset for the next bounded batch
        default: '0'
      query_limit:
        description: Queries per project (1 to 50)
        default: '30'
      depth:
        description: Result depth (1 to 3)
        default: '1'
      include_emails:
        description: Read publicly listed business emails
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: prospect-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: [prime24ai, agents, mediamatch, learn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native scraper
        run: go build -o google-maps-scraper .
      - name: Install matching browser
        run: |
          playwright_version=$(go list -m -f '{{.Version}}' github.com/mxschmitt/playwright-go)
          go run "github.com/mxschmitt/playwright-go/cmd/playwright@$playwright_version" install --with-deps chromium
      - name: Create bounded query batch
        env:
          PROJECT: ${{ matrix.project }}
          REGION: ${{ inputs.region || 'nationwide' }}
          OFFSET: ${{ inputs.offset || '0' }}
          QUERY_LIMIT: ${{ inputs.query_limit || '30' }}
        run: |
          mkdir -p out
          python3 alpha/worldwide.py --project "$PROJECT" --region "$REGION" --offset "$OFFSET" --limit "$QUERY_LIMIT" --output out/queries.txt
      - name: Run native scraper
        env:
          DEPTH: ${{ inputs.depth || '1' }}
          INCLUDE_EMAILS: ${{ github.event_name == 'push' || inputs.include_emails }}
        run: |
          [[ "$DEPTH" =~ ^[1-3]$ ]] || { echo 'Depth must be 1..3'; exit 1; }
          args=(-input out/queries.txt -results out/results.csv -depth "$DEPTH" -c 2 -exit-on-inactivity 3m)
          if [ "$INCLUDE_EMAILS" = true ]; then args+=(-email); fi
          timeout 20m ./google-maps-scraper "${args[@]}"
          python3 - <<'PY'
          import csv
          with open('out/results.csv', newline='', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('No Maps results. Use official-site research fallback.')
          print(f'Collected {len(rows)} candidate listings. Official-site verification required.')
          PY
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospects-${{ inputs.region || 'nationwide' }}-${{ matrix.project }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
